<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1917" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <title>Store</title>
    <meta name="description" content="Your online marketplace" />
    <meta property="og:title" content="Store" />
    <meta property="og:description" content="Your online marketplace" />
    <meta property="og:type" content="website" />
    <script>
      // Before first paint: dark mode and the store theme from the last visit (see src/lib/storeTheme.ts),
      // so pages don't flash the default look while settings load.
      (function () {
        try {
          var mode = localStorage.getItem("theme");
          if (mode === "dark" || (!mode && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
          }
          var c = JSON.parse(localStorage.getItem("store-theme") || "null");
          if (!c || !c.layers) return;
          var css = ["theme", "accent", "brand"].map(function (k) { return c.layers[k] || ""; }).filter(Boolean).join("\n");
          if (css) {
            var s = document.createElement("style");
            s.id = "store-theme";
            s.textContent = css;
            document.head.appendChild(s);
          }
          if (typeof c.fontsHref === "string" && c.fontsHref.indexOf("https://fonts.googleapis.com/") === 0) {
            var l = document.createElement("link");
            l.id = "store-theme-fonts";
            l.rel = "stylesheet";
            l.href = c.fontsHref;
            document.head.appendChild(l);
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
